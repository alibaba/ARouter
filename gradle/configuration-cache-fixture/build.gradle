buildscript {
    def arouterRepository = project.findProperty('arouter.repository')
    def registerVersion = project.findProperty('arouter.register.version')
    def androidGradlePluginVersion = project.findProperty('arouter.agp.version') ?: '7.4.2'
    if (!arouterRepository || !registerVersion) {
        throw new GradleException('ARouter local repository and register version are required.')
    }

    repositories {
        maven { url uri(arouterRepository) }
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${androidGradlePluginVersion}"
        classpath "com.alibaba:arouter-register:${registerVersion}"
    }
}

allprojects {
    def arouterRepository = rootProject.findProperty('arouter.repository')
    repositories {
        maven { url uri(arouterRepository) }
        google()
        mavenCentral()
    }
}
