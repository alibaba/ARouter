apply plugin: 'com.android.library'

def fixtureCompileSdk = Integer.parseInt(
        (rootProject.findProperty('arouter.compile.sdk') ?: '33').toString()
)
def fixtureBuildTools = (rootProject.findProperty('arouter.build.tools') ?: '33.0.2').toString()

android {
    namespace 'com.alibaba.android.arouter.configcache.online'
    compileSdkVersion fixtureCompileSdk
    buildToolsVersion fixtureBuildTools

    defaultConfig {
        minSdkVersion 14

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [AROUTER_MODULE_NAME: 'featureonline']
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation "com.alibaba:arouter-api:${rootProject.findProperty('arouter.api.version')}"
    annotationProcessor "com.alibaba:arouter-compiler:${rootProject.findProperty('arouter.compiler.version')}"
}
