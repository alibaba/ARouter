apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlin-android-extensions'

kapt {
    arguments {
        arg("AROUTER_MODULE_NAME", project.getName())
        arg("AROUTER_GENERATE_DOC", "enable")
    }
}

dependencies {
    implementation project(':arouter-api')
    implementation project(':arouter-annotation')
    kapt project(':arouter-compiler')
    implementation "com.android.support:appcompat-v7:${SUPPORT_LIB_VERSION}"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
}
android {
    compileSdkVersion Integer.parseInt(COMPILE_SDK_VERSION)
    buildToolsVersion BUILDTOOLS_VERSION

    defaultConfig {
        minSdkVersion Integer.parseInt(MIN_SDK_VERSION)
        targetSdkVersion Integer.parseInt(TARGET_SDK_VERSION)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        lintOptions { abortOnError false }
    }
}

def routeDocModuleName = project.name.replaceAll("[^0-9a-zA-Z_]+", "")
def debugRouteDoc = file("$buildDir/generated/source/kapt/debug/com/alibaba/android/arouter/docs/arouter-map-of-${routeDocModuleName}.json")
def requiredDebugRoutes = [
        "/kotlin/test",
        "/kotlin/service/pretreatment"
]

def verifyKaptRouteDoc = tasks.create("verifyKaptRouteDoc") {
    group = "verification"
    description = "Verifies that KAPT generated the Kotlin demo route document."
    dependsOn "kaptDebugKotlin"

    doLast {
        if (!debugRouteDoc.isFile()) {
            throw new GradleException("KAPT route document was not generated: $debugRouteDoc")
        }

        String routeDoc = debugRouteDoc.getText("UTF-8")
        requiredDebugRoutes.each { String path ->
            if (!routeDoc.contains("\"path\": \"$path\"")) {
                throw new GradleException("KAPT route document is missing path [$path]: $debugRouteDoc")
            }
        }
    }
}

afterEvaluate {
    tasks.getByName("check").dependsOn verifyKaptRouteDoc
}
